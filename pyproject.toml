[project]
name = "priorlab-berlin-hack"
version = "0.1.0"
description = "TabPFN experiments on flybody flight data (HackLab #2, Prior Labs track)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.9,<4",
  "python-dotenv>=1,<2",
  "tabpfn-client>=0.10,<1",
]

# Local GPU inference (TabPFN 3.5 / 3.5 Fast) on the teammates' machines: `uv sync --extra local`.
[project.optional-dependencies]
local = ["tabpfn>=10,<11"]

[tool.uv]
package = false
