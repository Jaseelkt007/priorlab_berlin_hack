[project]
name = "priorlab-berlin-hack"
version = "0.1.0"
description = "TabPFN predicts per-pick drop risk at each speed for a simulated high-speed delta (IRB 360-class) suction picking line"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mujoco>=3.3",
  "ruckig>=0.19",
  "numpy",
  "scipy",
  "pandas",
  "scikit-learn",
  "tabpfn>=10.2",
  "python-dotenv",
  "numba>=0.68.1",
  "toppra>=0.6.11",
]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.uv]
package = false
